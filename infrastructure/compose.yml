services:
  db:
    image: postgres:18-alpine
    container_name: elite-v2-db
    restart: unless-stopped

    env_file:
      - ../.env

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ../backend

    container_name: elite-v2-backend
    restart: unless-stopped

    env_file:
      - ../.env

    volumes:
    - ../backend:/app
    - ../media:/media
    - ../frontend:/legacy_frontend:ro
    - ../reports:/reports

    ports:
      - "8001:8000"

    depends_on:
      db:
        condition: service_healthy

    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data: